AUGMENTATION:
  TRAIN_CROP_SIZE: [480, 640]
  EVAL_CROP_SIZE: [480, 640]

LOGGING:
  SCALAR_INTERVAL: 20
  TEXT_INTERVAL: 100
  IMAGE_INTERVAL: 0
  VALID_IMAGE_INTERVAL: 5
  VALID_IMAGE_COUNT: 4
  VALID_ERROR_MAX: 5.0

MODEL:
  VERSION: las2
  MODEL_SIZE: s
  ARCHITECTURE: las2_s_hfe_multiscale_v1
  MAX_DISP: 192
  PRETRAINED: tmp/experiments/hfe_20w_warmstart/best.pth
  AGGREGATION_PRETRAINED: tmp/experiments/outside_grass_20260417_seed2026/baseline_seed2026_ddp/best.pth
  HFE:
    CUTOFF_RATIO: 0.1
  COST_STABILIZATION:
    ENABLED: false

TRAIN:
  OUTPUT_DIR: tmp/experiments/hfe_multiscale_20w
  LOG_DIR: tmp/experiments/hfe_multiscale_20w/tensorboard
  EPOCHS: 30
  BATCH_SIZE: 8
  NUM_WORKERS: 4
  SEED: 2026
  LR: 0.00005
  WEIGHT_DECAY: 0.0001
  SCHEDULER:
    NAME: warmup_cosine
    MIN_LR: 0.000001
    WARMUP_EPOCHS: 2
    WARMUP_START_LR: 0.0000001
  AMP: true
  RESUME: none
  GRAD_CLIP: 1.0
  LOSS:
    LAMBDA_CVC_C0: 4.0
    LAMBDA_CVC_C2: 48.0
    LAMBDA_D0: 0.005
    LAMBDA_D2: 1.0
    LAMBDA_DISP: 1.0

LOSS_ABLATION:
  NAME: l1_disp_up_plus_aux
